<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b32">
<title>SkyNav Pro</title>
<style>
:root{--bg:#071b32;--panel:#0d2946;--panel2:#103454;--line:#214766;--cyan:#4bd5e8;--gold:#f4c66a;--text:#eff7ff;--muted:#a9bfd2;--green:#61d6a4;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#12395a 0,transparent 34%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.75}
button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:0 20px}
header{border-bottom:1px solid #ffffff18;background:#06172bdc;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),#2772ad);display:grid;place-items:center;color:#06223b;font-size:22px}
.navlinks{display:flex;gap:7px;flex-wrap:wrap}.navlinks a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:9px;font-size:13px}.navlinks a:hover{background:#ffffff12;color:white}
.lang{background:#102d49;border:1px solid var(--line);color:white;padding:7px 10px;border-radius:9px}
.hero{padding:65px 0 40px;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}.eyebrow{color:var(--cyan);font-size:13px;font-weight:bold;letter-spacing:1px}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.25;margin:12px 0}.hero p{color:var(--muted);max-width:660px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.btn{border:0;border-radius:11px;padding:11px 17px;font-weight:bold;background:var(--cyan);color:#052039}.btn.secondary{background:#173b5c;color:var(--text);border:1px solid var(--line)}
.skyart{min-height:245px;border:1px solid #2c5676;border-radius:25px;background:linear-gradient(145deg,#103653,#081b30);position:relative;overflow:hidden;display:grid;place-items:center}
.skyart:before,.skyart:after{content:"";position:absolute;width:310px;height:110px;border:1px solid #4bd5e833;border-radius:50%;transform:rotate(-23deg)}.skyart:after{width:420px;height:160px}
.plane{font-size:95px;z-index:1;transform:rotate(-12deg);filter:drop-shadow(0 12px 15px #0008)}.radar{position:absolute;bottom:16px;left:18px;color:#7cb3d3;font-size:11px;letter-spacing:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 38px}.stat{background:#0b2742;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:21px;color:var(--cyan)}.stat span{font-size:12px;color:var(--muted)}
.section{padding:28px 0 18px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:17px}.section h2{font-size:25px;margin:0}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(160deg,#103250,#0a223b);border:1px solid var(--line);border-radius:16px;padding:18px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#4bd5e888}.card .ico{font-size:27px}.card h3{margin:6px 0 4px;font-size:17px}.card p{margin:0;color:var(--muted);font-size:13px}.tag{display:inline-block;color:var(--cyan);font-size:11px;margin-top:12px;background:#4bd5e815;padding:3px 8px;border-radius:20px}
.content{display:grid;grid-template-columns:240px 1fr;gap:15px}.side{background:#0b2742;border:1px solid var(--line);border-radius:15px;padding:10px;height:max-content}.side button{display:block;width:100%;text-align:right;background:none;border:0;color:var(--muted);padding:10px;border-radius:9px}.side button.active,.side button:hover{background:#164467;color:white}.detail{background:#0b2742;border:1px solid var(--line);border-radius:15px;padding:22px;min-height:260px}.detail h3{margin-top:0;color:var(--cyan)}.detail li{margin:7px 0}.note{background:#4bd5e812;border-right:3px solid var(--cyan);padding:12px 15px;border-radius:8px;color:#d9f5fb;font-size:13px;margin-top:15px}
.runway{height:150px;background:#202e3c;border:1px solid #647587;border-radius:13px;position:relative;margin:18px 0;overflow:hidden;display:flex;align-items:center;justify-content:center}.runway:before{content:"";height:3px;width:85%;background:repeating-linear-gradient(90deg,#fff 0 24px,transparent 24px 42px)}.runway .threshold{position:absolute;top:22px;bottom:22px;width:55px;border-left:5px solid white;border-right:5px solid white;left:12%}.runway .number{position:absolute;right:13%;color:white;font-size:25px;font-weight:bold}
.quizbox{background:#0b2742;border:1px solid var(--line);border-radius:16px;padding:22px}.qmeta{color:var(--cyan);font-size:12px}.question{font-size:19px;font-weight:bold;margin:8px 0 15px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{background:#123553;border:1px solid #2c5270;color:white;border-radius:10px;padding:11px;text-align:right}.answer:hover{border-color:var(--cyan)}.answer.correct{background:#164b3b;border-color:var(--green)}.answer.wrong{background:#542e36;border-color:var(--red)}#feedback{min-height:28px;color:var(--gold);margin-top:12px}.quizfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;color:var(--muted);font-size:13px}
.search{width:min(100%,320px);background:#071b32;border:1px solid var(--line);color:white;border-radius:10px;padding:9px 12px}
footer{border-top:1px solid #ffffff18;margin-top:50px;padding:25px 0;color:var(--muted);font-size:12px}.disclaimer{background:#3b321d;border:1px solid #77613a;color:#ffe4a5;border-radius:13px;padding:15px;margin-top:22px;font-size:13px}
.hidden{display:none}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:38px}.skyart{min-height:190px}.grid{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{white-space:nowrap;text-align:center;width:auto}.navlinks{display:none}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:10px}.answers{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.hero h1{font-size:34px}}

a.btn{text-decoration:none;display:inline-block}.card{cursor:pointer}.card:focus-visible{outline:2px solid var(--cyan)}
[dir=ltr] .side button,[dir=ltr] .answer{text-align:left}[dir=ltr] .note{border-right:0;border-left:3px solid var(--cyan)}
.foot2{float:inline-end}#empty{color:var(--muted);padding:14px 4px}
.calc{background:#071b32;border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}.calc b{color:var(--gold)}.calc input{width:90px;background:#0d2946;border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px 9px;margin:0 8px}
.bar{height:6px;background:#123553;border-radius:6px;margin-bottom:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan);transition:.3s}
.big{font-size:44px;color:var(--cyan);font-weight:800}
</style>
</head>

<script>
const PA={
runway:{title:"المدارج وممرات الطائرات",lead:"المدرج هو السطح المجهز لإقلاع الطائرات وهبوطها، بينما تربط ممرات التاكسي المدرج بمناطق الوقوف والمنشآت.",body:["رقم المدرج يشير تقريباً إلى اتجاهه المغناطيسي مقسوماً على عشرة؛ فالمدرج 09 يتجه نحو 090° تقريباً، والمدرج 27 نحو 270° تقريباً.","تُستخدم علامات خط المنتصف وحدود المدرج ومنطقة التلامس لمساعدة الطيار على التعرف البصري على سطح الهبوط.","ممرات التاكسي غالباً ما تُميّز بخطوط صفراء، بينما تختلف علامات المدرج بحسب موقعها ووظيفتها."],note:"رسم توضيحي مبسط — لا يمثل تخطيط مدرج حقيقي أو بيانات مطار."},
nav:{title:"أنظمة الملاحة الجوية",lead:"تساعد وسائل الملاحة الطيار على تحديد الموقع والاتجاه والمسار، وتختلف دقتها وتغطيتها ومتطلبات استخدامها.",body:["VOR: منارة راديوية أرضية توفر معلومات الاتجاه بالنسبة إلى المحطة.","DME: يقيس المسافة المائلة بين الطائرة ومحطة أرضية متوافقة.","ILS: نظام هبوط آلي/آليّ التوجيه يوفر إرشاداً جانبياً وعمودياً عند الاقتراب، وفق فئة التجهيز والتشغيل.","GNSS/GPS: يعتمد على أنظمة الملاحة بالأقمار الصناعية، مع ضرورة مراعاة الاعتمادية والملاحة المعتمدة."],note:"وجود جهاز ملاحي على متن الطائرة لا يعني أن كل إجراء أو مسار مسموح؛ تُتبع الخرائط والإجراءات المعتمدة."},
atc:{title:"مراقبة الحركة الجوية ATC",lead:"تهدف خدمات مراقبة الحركة الجوية إلى تعزيز السلامة وتنظيم تدفق الحركة ومنع التصادمات ضمن المجال الذي تقدم فيه الخدمة.",body:["مراقبة البرج (TWR): تتعامل عادةً مع حركة الطائرات على المدرج وفي محيط المطار وفق نطاق الخدمة.","مراقبة الاقتراب (APP): تنظم حركة الوصول والمغادرة في منطقة الاقتراب.","مراقبة المنطقة (ACC): تقدم خدمات المراقبة ضمن قطاعات جوية أوسع.","الاتصال اللاسلكي يتطلب الاستماع الدقيق، استخدام المصطلحات القياسية، وإعادة قراءة التعليمات الحرجة."],note:"هذا وصف تعريفي عام؛ توزيع المسؤوليات والإجراءات يختلف حسب الدولة والمطار."},
instruments:{title:"أجهزة الطائرة الأساسية",lead:"تعرض أجهزة الطيران معلومات تساعد الطيار على فهم حالة الطائرة واتجاهها وارتفاعها وسرعتها.",body:["مقياس الارتفاع Altimeter: يعرض الارتفاع اعتماداً على الضغط المرجعي المضبوط.","مؤشر السرعة الجوية Airspeed Indicator: يعرض السرعة الجوية وفق نظام قياس الطائرة.","مؤشر الوضعية Attitude Indicator: يوضح ميلان الطائرة بالنسبة إلى الأفق.","مؤشر الاتجاه Heading Indicator: يعرض اتجاه مقدمة الطائرة، مع متطلبات التحقق والمعايرة بحسب النظام."],note:"تختلف تجهيزات قمرة القيادة بين الطائرات؛ يجب الرجوع إلى دليل الطائرة والتدريب المعتمد."},
airspace:{title:"المجال الجوي",lead:"يُقسّم المجال الجوي إلى مناطق وطبقات لتحديد نوع الخدمات والإجراءات والمتطلبات المطبقة.",body:["تستخدم دول كثيرة تصنيفات ICAO من A إلى G، لكن التطبيق والتوافر يختلفان بحسب الدولة.","قد توجد مناطق مراقبة حول المطارات ومناطق معلومات الطيران ومناطق محظورة أو مقيدة أو خطرة.","تحدد الخرائط الجوية المنشورة الحدود والارتفاعات والقيود والإجراءات ذات الصلة."],note:"لا تعتمد على هذا الملخص لتحديد صلاحية دخول مجال جوي؛ تحقق من AIP وNOTAM والخرائط الرسمية السارية."},
lights:{title:"أضواء الطائرة وإشاراتها",lead:"تساعد الأضواء الخارجية على رؤية الطائرة وتحديد اتجاهها أو دعم عمليات الطيران والاقتراب.",body:["أضواء الملاحة: أحمر على الجناح الأيسر، أخضر على الجناح الأيمن، وأبيض في الخلف في الترتيب الشائع.","الأضواء الومّاضة المضادة للتصادم تشمل عادةً أضواء Beacon وStrobe وفق تجهيز الطائرة.","أضواء الهبوط والتاكسي تُستخدم بحسب مرحلة التشغيل وإجراءات الطائرة والمطار."],note:"قد تختلف التجهيزات وطريقة الاستخدام؛ المرجع هو دليل التشغيل المعتمد للطراز."}
};
const PE={
runway:{title:"Runways and Taxiways",lead:"A runway is the prepared surface for takeoff and landing; taxiways connect runways with parking areas and facilities.",body:["A runway number is roughly its magnetic heading divided by ten: runway 09 points about 090°, runway 27 about 270°.","Centerline, edge and touchdown-zone markings help pilots visually identify the landing surface.","Taxiways are often marked with yellow lines, while runway markings vary by position and function."],note:"Simplified sketch — not a real runway layout or airport data."},
nav:{title:"Air Navigation Systems",lead:"Navigation aids help pilots determine position, direction and track; accuracy, coverage and usage requirements differ.",body:["VOR: a ground radio beacon giving bearing information relative to the station.","DME: measures slant distance between the aircraft and a compatible ground station.","ILS: an approach guidance system giving lateral and vertical guidance, depending on equipment category and operation.","GNSS/GPS: satellite-based navigation, with reliability and approved-navigation requirements to consider."],note:"Having a nav device on board does not mean every procedure or route is allowed; follow approved charts and procedures."},
atc:{title:"Air Traffic Control (ATC)",lead:"ATC services aim to improve safety, organise traffic flow and prevent collisions within the airspace where service is provided.",body:["Tower (TWR): typically handles traffic on the runway and around the airport, within its service scope.","Approach (APP): organises arriving and departing traffic in the approach area.","Area control (ACC): provides control services in wider airspace sectors.","Radio communication requires careful listening, standard phraseology and readback of critical instructions."],note:"A general description only; responsibilities and procedures vary by country and airport."},
instruments:{title:"Basic Aircraft Instruments",lead:"Flight instruments show information on the aircraft's state, heading, altitude and speed.",body:["Altimeter: shows altitude based on the set reference pressure.","Airspeed Indicator: shows airspeed according to the aircraft's measuring system.","Attitude Indicator: shows the aircraft's bank and pitch relative to the horizon.","Heading Indicator: shows the direction the nose points, with checking and calibration requirements depending on the system."],note:"Cockpit equipment varies between aircraft; refer to the aircraft manual and approved training."},
airspace:{title:"Airspace",lead:"Airspace is divided into zones and layers that define the services, procedures and requirements that apply.",body:["Many countries use ICAO classes A to G, but application and availability differ by country.","Control zones around airports, flight information regions, and prohibited, restricted or danger areas may exist.","Published aeronautical charts define boundaries, altitudes, restrictions and related procedures."],note:"Do not rely on this summary to decide whether you may enter airspace; check AIP, NOTAM and current official charts."},
lights:{title:"Aircraft Lights and Signals",lead:"External lights make the aircraft visible, show its orientation, or support operations and approach.",body:["Navigation lights: red on the left wingtip, green on the right, white at the tail in the common arrangement.","Anti-collision flashing lights usually include beacon and strobe lights, depending on equipment.","Landing and taxi lights are used according to phase of operation and aircraft and airport procedures."],note:"Equipment and usage may vary; the approved operating manual for the type is the reference."}};
const PF={
runway:{title:"Pistes et voies de circulation",lead:"Une piste est la surface aménagée pour le décollage et l'atterrissage ; les taxiways relient les pistes aux aires de stationnement et aux installations.",body:["Le numéro de piste correspond environ au cap magnétique divisé par dix : la piste 09 est orientée vers 090° environ, la 27 vers 270°.","Les marques d'axe, de bord et de zone de toucher aident le pilote à identifier visuellement la surface d'atterrissage.","Les taxiways sont souvent signalés par des lignes jaunes, tandis que les marques de piste varient selon leur position et leur fonction."],note:"Schéma simplifié — il ne représente ni une piste réelle ni des données d'aéroport."},
nav:{title:"Systèmes de navigation aérienne",lead:"Les aides à la navigation aident le pilote à déterminer sa position, sa direction et sa route ; leur précision, leur couverture et leurs conditions d'emploi varient.",body:["VOR : radiobalise au sol fournissant l'azimut par rapport à la station.","DME : mesure la distance oblique entre l'avion et une station sol compatible.","ILS : système d'aide à l'approche fournissant un guidage latéral et vertical, selon la catégorie d'équipement et d'exploitation.","GNSS/GPS : navigation par satellites, avec des exigences de fiabilité et de navigation approuvée."],note:"Disposer d'un instrument de navigation ne signifie pas que toute procédure ou route est autorisée ; suivez les cartes et procédures approuvées."},
atc:{title:"Contrôle de la circulation aérienne (ATC)",lead:"Les services ATC visent à renforcer la sécurité, organiser le flux de trafic et prévenir les collisions dans l'espace où le service est fourni.",body:["Tour (TWR) : gère généralement le trafic sur la piste et autour de l'aéroport, dans son périmètre de service.","Approche (APP) : organise les arrivées et départs dans la zone d'approche.","Contrôle régional (ACC) : fournit le contrôle dans des secteurs plus vastes.","La radio exige une écoute attentive, une phraséologie standard et la collation des instructions critiques."],note:"Description générale ; les responsabilités et procédures varient selon le pays et l'aéroport."},
instruments:{title:"Instruments de base de l'avion",lead:"Les instruments de vol affichent des informations sur l'état, le cap, l'altitude et la vitesse de l'avion.",body:["Altimètre : indique l'altitude selon la pression de référence réglée.","Anémomètre : indique la vitesse air selon le système de mesure de l'avion.","Horizon artificiel : montre l'inclinaison et l'assiette par rapport à l'horizon.","Conservateur de cap : indique la direction du nez, avec des vérifications et un calage selon le système."],note:"Les équipements varient selon les avions ; consultez le manuel de l'avion et la formation approuvée."},
airspace:{title:"Espace aérien",lead:"L'espace aérien est divisé en zones et en couches qui définissent les services, procédures et exigences applicables.",body:["De nombreux pays utilisent les classes OACI de A à G, mais l'application et la disponibilité diffèrent selon le pays.","Il peut exister des zones de contrôle autour des aéroports, des régions d'information de vol et des zones interdites, réglementées ou dangereuses.","Les cartes aéronautiques publiées précisent les limites, altitudes, restrictions et procédures associées."],note:"Ne vous fiez pas à ce résumé pour savoir si vous pouvez pénétrer dans un espace aérien ; vérifiez l'AIP, les NOTAM et les cartes officielles en vigueur."},
lights:{title:"Feux et signaux de l'avion",lead:"Les feux extérieurs rendent l'avion visible, indiquent son orientation ou soutiennent les opérations et l'approche.",body:["Feux de navigation : rouge à l'extrémité de l'aile gauche, vert à droite, blanc à l'arrière selon la disposition courante.","Les feux anticollision à éclats comprennent généralement le beacon et le strobe, selon l'équipement.","Les feux d'atterrissage et de roulage s'utilisent selon la phase d'exploitation et les procédures de l'avion et de l'aéroport."],note:"Les équipements et usages peuvent varier ; le manuel d'exploitation approuvé du type fait référence."}};
const QA=[
{q:"ما الوظيفة الأساسية لنظام VOR؟",a:["تحديد الاتجاه بالنسبة إلى محطة أرضية","قياس حرارة المحرك","إضاءة المدرج","قياس وزن الطائرة"],c:0,e:"يوفر VOR معلومات اتجاهية بالنسبة إلى المحطة."},

if($('hdg'))$('hdg').oninput=e=>{let h=Math.min(360,Math.max(1,+e.target.value||1));hdg=h;const[a,b]=rwy(h);$('rnum').textContent=pad(a);$('rout').textContent=pad(a)+' / '+pad(b)}}

function mark(){const q=Q[L][qi],u=U[L];document.querySelectorAll('.answer').forEach((b,j)=>{if(j===q.c)b.classList.add('correct');else if(j===picked)b.classList.add('wrong');b.disabled=true});$('feedback').textContent=(picked===q.c?u.ok:u.no)+q.e;$('next').disabled=false}
function showQ(){const u=U[L],n=Q[L].length;$('score').textContent=`${u.sc}: ${score}`;$('bar').style.width=((done?n:qi)/n*100)+'%';
if(done){$('qmeta').textContent=u.res;$('question').innerHTML=`<span class="big">${score} / ${n}</span>`;$('answers').innerHTML='';$('feedback').textContent=u.msg[score>=n-1?2:score>=Math.ceil(n/2)?1:0];$('next').textContent=u.rs;$('next').disabled=false;return}
const q=Q[L][qi];$('qmeta').textContent=u.qm.replace('{i}',qi+1).replace('{n}',n);$('question').textContent=q.q;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=qi===n-1?u.fin:u.nx;
$('answers').innerHTML=q.a.map((a,i)=>`<button class="answer" data-i="${i}">${a}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(picked!==null)return;picked=+b.dataset.i;if(picked===q.c)score++;$('score').textContent=`${u.sc}: ${score}`;mark()});if(picked!==null)mark()}

function go(id){render(id);$('library').scrollIntoView({behavior:'smooth'})}
